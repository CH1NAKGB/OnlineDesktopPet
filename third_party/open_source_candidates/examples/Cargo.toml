[package]
name = "chick-link-upstream-examples"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
axum = { version = "=0.8.9", features = ["ws"] }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mdns-sd = "=0.21.0"
env_logger = { version = "=0.11.6", default-features = false, features = ["humantime"] }

[[bin]]
name = "axum-chat"
path = "../source/axum-chat/examples/chat/src/main.rs"

[[bin]]
name = "mdns-query"
path = "../source/mdns-sd/examples/query.rs"

[[bin]]
name = "mdns-register"
path = "../source/mdns-sd/examples/register.rs"
