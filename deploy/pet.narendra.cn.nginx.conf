# Include this server block once in the BaoTa Nginx http context.
# Confirm certificate paths in the panel before testing/reloading Nginx.
server {
    listen 18443 ssl;
    server_name pet.narendra.cn;

    ssl_certificate /www/server/panel/vhost/cert/pet.narendra.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/pet.narendra.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;

    location = /ws {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:18080;
    }

    location / { return 404; }
}
