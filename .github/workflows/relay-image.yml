name: Relay image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and test encrypted relay
        run: |
          sh deploy/relay.sh up
          sh deploy/relay.sh check
          docker compose --env-file deploy/.env -f deploy/docker-compose.encrypted-direct.yml ps
      - name: Export tested image
        run: |
          docker save chicklink-relay:0.3.3 | gzip > ChickLink-relay-linux-x64-v0.3.3.tar.gz
          sha256sum ChickLink-relay-linux-x64-v0.3.3.tar.gz > relay-image.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: relay-linux-x64-v0.3.3
          path: |
            ChickLink-relay-linux-x64-v0.3.3.tar.gz
            relay-image.sha256
          retention-days: 7
      - name: Diagnostics
        if: failure()
        run: docker compose --env-file deploy/.env -f deploy/docker-compose.encrypted-direct.yml logs --tail=100
