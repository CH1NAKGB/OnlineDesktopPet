[package]
name = "pet-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
ab_glyph = "0.2"
bytemuck = "1.21"
futures-util = "0.3"
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = { version = "0.31", default-features = false, features = ["clipboard"] }
mdns-sd = "0.21"
native-tls = "0.2"
pollster = "0.4"
rand = "0.9"
rsa = "0.9"
rodio = { version = "0.20.1", default-features = false }
serde.workspace = true
serde_json.workspace = true
shared-protocol = { path = "../shared-protocol" }
tokio.workspace = true
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
url = "2.5"
wgpu = "24.0"
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.19"

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.24"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
