[workspace]
members = ["pet-client", "relay-server", "shared-protocol"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.3.3"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
